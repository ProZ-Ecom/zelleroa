
name: Zellora Build

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Environment File
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build_db"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zellora-build
          path: |
            .next/
            public/
          retention-days: 7

      - name: Publish Build to build-output Branch
        run: |
          git clone --branch build-output https://x-access-token:${{ github.token }}@github.com/ProZ-Ecom/zelleroa.git deploy

          rm -rf deploy/.next deploy/public
          cp -r .next public deploy/

          cd deploy
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -f .next public

          if ! git diff --cached --quiet; then
            git commit -m "Update Zellora build"
            git push origin build-output
          else
            echo "No build changes to publish"
          fi
