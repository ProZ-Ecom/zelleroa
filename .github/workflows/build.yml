
name: Zellora Build and Transfer

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: BUILD APPLICATION

  build:
    name: Build Zellora
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Environment File
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build_db"

      - name: Find Large Build Files
        run: |
          echo "Checking large build files..."
          find .next public -type f -size +90M -exec ls -lh {} \;

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zellora-build
          path: |
            .next/
            public/
          include-hidden-files: true
          retention-days: 7


  # JOB 2: TRANSFER BUILD TO SERVER

  transfer:
    name: Transfer Build to Server
    needs: build
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: "103.178.158.196"
      SERVER_USER: "proz"
      SERVER_PORT: "22"
      REMOTE_DIR: "/home/proz/projects/zellora_buildts"

    steps:

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: zellora-build
          path: downloaded-build

      - name: Create Build Archive
        run: |
          tar -czf zellora-build.tar.gz -C downloaded-build .
          ls -lh zellora-build.tar.gz

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "$SERVER_PORT" \
            -t ed25519 "$SERVER_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Transfer Build to Server
        run: |
          sshpass -e scp -o StrictHostKeyChecking=yes \
            -P "$SERVER_PORT" \
            zellora-build.tar.gz \
            "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/"
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

      - name: Verify Transferred Archive
        run: |
          LOCAL_SHA=$(sha256sum zellora-build.tar.gz | awk '{print $1}')

          REMOTE_SHA=$(sshpass -e ssh \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "sha256sum '$REMOTE_DIR/zellora-build.tar.gz' | awk '{print \$1}'")

          echo "Local checksum: $LOCAL_SHA"
          echo "Remote checksum: $REMOTE_SHA"

          test "$LOCAL_SHA" = "$REMOTE_SHA"
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}

      - name: Replace Old Build Files
        run: |
          sshpass -e ssh \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "set -e
             cd '$REMOTE_DIR'

             rm -rf incoming
             mkdir incoming

             tar -xzf zellora-build.tar.gz -C incoming

             test -d incoming/.next

             rm -rf .next public

             mv incoming/.next .

             if [ -d incoming/public ]; then
               mv incoming/public .
             fi

             rm -rf incoming

             echo 'Build files replaced successfully'
             ls -lah"
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
