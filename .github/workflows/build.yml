
name: Zellora Build

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Environment File
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build_db"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zellora-build
          path: |
            .next/
            public/
          retention-days: 7
